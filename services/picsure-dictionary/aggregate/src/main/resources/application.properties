spring.profiles.active=production
spring.application.name=dictionary
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}?currentSchema=dict
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=80

# The gateway forwards X-User-Privileges with one PRIV_MANAGED_* name per dbGaP consent; for high-consent users that
# single header exceeds Tomcat's default 8KB request-header budget, which rejects the request with a container-level
# 400 before any filter runs. Sized for growth as studies onboard.
server.max-http-request-header-size=${PICSURE_MAX_REQUEST_HEADER_SIZE:64KB}

dashboard.columns={abbreviation:'Abbreviation',name:'Name',clinvars:'Clinical Variables'}
dashboard.column-order=abbreviation,name,clinvars
dashboard.nonmeta-columns=abbreviation,name
dashboard.enable.extra_details=true
dashboard.enable.bdc_hack=false
dashboard.layout.type=default

filtering.unfilterable_concepts=stigmatized

# Logging File Output https://docs.spring.io/spring-boot/reference/features/logging.html#features.logging.file-output
# If you are adding additional log files please add them to /var/log/ directory.
logging.file.name=/var/log/aggdict.log