spring:
  application:
    name: pic-sure-operations-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://picsure-db:3306/picsure?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&autoReconnectForPools=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:picsure}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # The PIC-SURE MySQL schema for Configuration, NamedDataset, and Query is managed by Flyway;
      # this service must never generate or alter its DDL.
      ddl-auto: none
      naming:
        # Preserve explicit JPA column names: legacy columns such as queryId and resourceResultId
        # must not be converted to snake_case.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

picsure:
  operations:
    # Shared secret enforced by InternalTokenFilter on /internal/** (the gateway's QueryAuthFetcher dispatch calls,
    # and any future hpds-query-service caller). Fail-closed: left blank, InternalTokenFilter rejects every
    # /internal/** request rather than treating an unconfigured secret as "wide open".
    internal-token: ${QUERY_SERVICE_INTERNAL_TOKEN:}
  # The X-Application-Token gate for /actuator/** (ActuatorSecurityConfig + the shared
  # ActuatorSecurityHelper in pic-sure-spring-commons). Shallow health/liveness/readiness stay open regardless.
  actuator:
    require-token: ${PICSURE_ACTUATOR_REQUIRE_TOKEN:true}
    token: ${PICSURE_APPLICATION_TOKEN:}
    header-name: X-Application-Token

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /operations
  # The gateway forwards X-User-Privileges with one PRIV_MANAGED_* name per dbGaP consent; for high-consent users that
  # single header exceeds Tomcat's default 8KB request-header budget, which rejects the request with a container-level
  # 400 before any filter runs. Sized for growth as studies onboard.
  max-http-request-header-size: ${PICSURE_MAX_REQUEST_HEADER_SIZE:64KB}

management:
  endpoints:
    web:
      exposure:
        # OFF BY DEFAULT: 'none' is a sentinel that matches no endpoint, so /actuator/** is 404. (An EMPTY include is
        # NOT off -- Spring Boot then falls back to exposing health.) AIO enables it via PICSURE_ACTUATOR_EXPOSURE;
        # prometheus/metrics are added via the same var in the monitoring (M2) rollout.
        include: ${PICSURE_ACTUATOR_EXPOSURE:none}
  endpoint:
    health:
      show-details: ${PICSURE_ACTUATOR_DETAILS:never} # default never; when_authorized (AIO) gates detail behind picsure.actuator.token
      probes:
        enabled: true # /actuator/health/liveness stays shallow-open
      group:
        # Explicit liveness group (mirrors the gateway's) -- pins /actuator/health/liveness to the app's
        # own process state so it never depends on the datasource or auto-registration nuances of probes.enabled.
        liveness:
          include: livenessState
        # Deep health: readiness is only reported UP once the datasource is actually reachable, not merely once the
        # process is running (mirrors the gateway's liveness/readiness split, adapted here for a service that --
        # unlike the gateway -- owns a real database dependency).
        readiness:
          include: readinessState,db
  health:
    defaults:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
