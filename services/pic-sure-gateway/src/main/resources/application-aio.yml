# AIO profile: WildFly is reachable by Docker DNS on the shared `picsure` network.
# WILDFLY_URL may still override (defaults to http://wildfly:8080 in application.yml).

# PSAMA is reachable by Docker DNS on the `picsure` network. These match WildFly's
# java:global/token_introspection_url and openAccessValidateUrl in standalone.xml.
# Env vars still override (BDC sets its own). The service token stays env-only.
picsure:
  gateway:
    security:
      introspection-url: ${TOKEN_INTROSPECTION_URL:http://psama:8090/auth/token/inspect}
      open-access-validate-url: ${OPEN_ACCESS_VALIDATE_URL:http://psama:8090/auth/open/validate}
