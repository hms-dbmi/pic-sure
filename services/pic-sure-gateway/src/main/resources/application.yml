spring:
  application:
    name: pic-sure-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Phase 3 (Task 1): explicit clean-prefix route for the logging service,
            # replacing the legacy /proxy/pic-sure-logging relay. order 100 < 1000 so it
            # wins over the catch-all. StripPrefix=1 drops the leading /logging segment
            # because the logging service (Javalin) serves its API at root (/audit,
            # /health, /info) — mirroring the old /proxy relay's prefix strip. /logging is
            # on the Phase-2 introspection allow-list, so it is not authenticated.
            # /dictionary and /uploader are AUTHENTICATED (not on the allow-list): the
            # introspection filter runs on the pre-strip public path (Target Service =
            # /dictionary/x), which the Phase-3 PSAMA access-rule migration now authorizes
            # (^/dictionary(/.*)?$ / ^/uploader(/.*)?$). Same StripPrefix=1 as /logging
            # (dictionary-api + uploader serve their APIs at root). /hpds and /visualization
            # remain out of scope (Phase 4 query-service ingress / dead WAR).
            - id: logging
              uri: ${LOGGING_URL:http://pic-sure-logging}
              order: 100
              predicates:
                - Path=/logging/**
              filters:
                - StripPrefix=1
            - id: dictionary
              uri: ${DICTIONARY_URL:http://dictionary-api}
              order: 100
              predicates:
                - Path=/dictionary/**
              filters:
                - StripPrefix=1
            - id: uploader
              uri: ${UPLOADER_URL:http://uploader:8080}
              order: 100
              predicates:
                - Path=/uploader/**
              filters:
                - StripPrefix=1
            # Phase 4 (gateway integration): query-service and operations-service ingress. Unlike the routes
            # above, these serve at the VERBATIM public path — NO StripPrefix. /hpds/{auth,open}[/v3]/query|search
            # is served entirely by the DB-free query-service, which selects auth/open from the path itself.
            # /configuration/** and /dataset/** are served by operations-service, the sole DB owner (also home to
            # the internal query dispatch API PsamaIntrospectionFilter/QueryAuthFetcher calls for result/signed-url
            # auth). /configuration/** carries a public-GET carve-out for the introspection filter itself (see
            # PsamaIntrospectionFilter#isPublicConfigurationRead) — everything else (POST/PATCH/DELETE, all
            # /configuration/admin/**, and all of /dataset/**) is introspected as usual once auth-enabled is true.
            - id: hpds
              uri: ${HPDS_QUERY_SERVICE_URL:http://pic-sure-hpds-query-service:8080}
              order: 100
              predicates:
                - Path=/hpds/**
            - id: configuration
              uri: ${OPERATIONS_SERVICE_URL:http://pic-sure-operations-service:8080}
              order: 100
              predicates:
                - Path=/configuration/**
            - id: dataset
              uri: ${OPERATIONS_SERVICE_URL:http://pic-sure-operations-service:8080}
              order: 100
              predicates:
                - Path=/dataset/**
            # Phase 1: single low-priority catch-all — everything forwards to WildFly
            # with the legacy context path re-prefixed. Public URLs are unchanged.
            - id: legacy-wildfly-catchall
              uri: ${WILDFLY_URL:http://wildfly:8080}
              order: 1000
              predicates:
                - Path=/**
              filters:
                - RewritePath=/(?<segment>.*), /pic-sure-api-2/PICSURE/$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized # detail gated; Phase 6 supplies the app token
      probes:
        enabled: true # /actuator/health/liveness stays shallow-open
      group:
        liveness:
          include: livenessState # pin liveness to the app's own state; downstreams
          # (registered as the "downstreams" top-level contributor) must never flip
          # this probe DOWN -- deploy/container healthchecks poll this endpoint.
  health:
    defaults:
      enabled: true
  metrics:
    distribution:
      # Publish client-observable latency percentiles per route for the Phase-1
      # baseline and ongoing comparison (visible at /actuator/prometheus and
      # /actuator/metrics/http.server.requests).
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8080

# DB-free auth/audit chain (Phase 2). auth-enabled is the master switch: false
# (default) => no auth/audit filters register, gateway is a pure pass-through.
# Secrets come from the environment (gateway.env); non-secret defaults are here.
picsure:
  gateway:
    security:
      auth-enabled: ${GATEWAY_OWNS_AUTH:false}
      open-access-enabled: ${GATEWAY_OPEN_ACCESS_ENABLED:false}
      user-id-claim: sub
      max-body-bytes: ${GATEWAY_AUTH_MAX_BODY_BYTES:10485760}
      gateway-owns-query-read-auth: ${GATEWAY_OWNS_QUERY_READ_AUTH:false}
      introspection-url: ${TOKEN_INTROSPECTION_URL:}
      open-access-validate-url: ${OPEN_ACCESS_VALIDATE_URL:}
      service-token: ${TOKEN_INTROSPECTION_TOKEN:}
      query-service-url: ${HPDS_QUERY_SERVICE_URL:}
      operations-service-url: ${OPERATIONS_SERVICE_URL:}
      query-service-internal-token: ${QUERY_SERVICE_INTERNAL_TOKEN:}
      allow-list-prefixes:
        - /logging
        - /actuator
        - /openapi
        - /swagger-ui
      query-read-paths:
        - ".*/query/[^/]+/(?:result|signed-url)/?$"
