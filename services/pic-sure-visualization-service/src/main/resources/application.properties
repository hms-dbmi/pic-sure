server.port=8080

# The gateway forwards X-User-Privileges with one PRIV_MANAGED_* name per dbGaP consent; for high-consent users that
# single header exceeds Tomcat's default 8KB request-header budget, which rejects the request with a container-level
# 400 before any filter runs. Sized for growth as studies onboard.
server.max-http-request-header-size=${PICSURE_MAX_REQUEST_HEADER_SIZE:64KB}

# Single HPDS ingress. Nothing but pic-sure-hpds-query-service talks to HPDS directly; this service posts
# /hpds/{auth,open}/v3/query/sync and lets that service select the backend and apply open-path obfuscation.
picsure.query-service.base-url=${HPDS_QUERY_SERVICE_URL:http://pic-sure-hpds-query-service:8080}

# Categorical chart limits
chart.categorical.max-categories=${CHART_MAX_CATEGORIES:7}

# RestTemplate timeouts (ms)
rest-template.connect-timeout=${REST_TEMPLATE_CONNECT_TIMEOUT:5000}
rest-template.read-timeout=${REST_TEMPLATE_READ_TIMEOUT:30000}

# Actuator: OFF BY DEFAULT. AIO's visualization.env sets PICSURE_ACTUATOR_EXPOSURE=health to enable a
# shallow health probe for the gateway /system/status aggregation; details stay hidden (never).
management.endpoints.web.exposure.include=${PICSURE_ACTUATOR_EXPOSURE:none}
management.endpoint.health.show-details=${PICSURE_ACTUATOR_DETAILS:never}

# Audit logging (no-op if unset)
logging.audit.url=${LOGGING_SERVICE_URL:}
logging.audit.api-key=${LOGGING_API_KEY:}

# Logging
logging.level.edu.harvard.dbmi.avillach.visualization=INFO
