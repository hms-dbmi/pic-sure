server.port=8080

# HPDS-compatible query endpoint base URL. In all-in-one this is the sibling HPDS
# container; in gateway deployments this is the PIC-SURE API base URL.
hpds.base-url=${HPDS_BASE_URL:http://hpds:8080/PIC-SURE}

# HPDS resource UUIDs (used for open/auth routing)
hpds.resource.authorized.uuid=${HPDS_RESOURCE_AUTHORIZED_UUID:}
hpds.resource.open.uuid=${HPDS_RESOURCE_OPEN_UUID:}

# Obfuscation parsing (must match HPDS open endpoint config)
obfuscation.threshold=${OBFUSCATION_THRESHOLD:10}
obfuscation.variance=${OBFUSCATION_VARIANCE:3}

# Categorical chart limits
chart.categorical.max-categories=${CHART_MAX_CATEGORIES:7}

# RestTemplate timeouts (ms)
rest-template.connect-timeout=${REST_TEMPLATE_CONNECT_TIMEOUT:5000}
rest-template.read-timeout=${REST_TEMPLATE_READ_TIMEOUT:30000}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Audit logging (no-op if unset)
logging.audit.url=${LOGGING_SERVICE_URL:}
logging.audit.api-key=${LOGGING_API_KEY:}

# Logging
logging.level.edu.harvard.dbmi.avillach.visualization=INFO
