server.port=8080

# HPDS call mode: "direct" (all-in-one) or "gateway" (BDC/FISMA)
hpds.call-mode=${HPDS_CALL_MODE:direct}

# Direct mode: HPDS base URL (sibling container)
hpds.direct.url=${HPDS_DIRECT_URL:http://hpds:8080/PIC-SURE}

# Gateway mode: PIC-SURE API URL (routes through WildFly)
picsure.api.url=${PICSURE_API_URL:http://wildfly:8080/PIC-SURE}

# HPDS resource UUIDs (used in both modes for open/auth routing)
hpds.resource.authorized.uuid=${HPDS_RESOURCE_AUTHORIZED_UUID:}
hpds.resource.open.uuid=${HPDS_RESOURCE_OPEN_UUID:}

# Obfuscation parsing (must match HPDS open endpoint config)
obfuscation.threshold=${OBFUSCATION_THRESHOLD:10}
obfuscation.variance=${OBFUSCATION_VARIANCE:3}

# Categorical chart limits
chart.categorical.max-categories=${CHART_MAX_CATEGORIES:7}

# RestTemplate timeouts (ms)
rest-template.connect-timeout=5000
rest-template.read-timeout=30000

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Audit logging (no-op if unset)
logging.audit.url=${LOGGING_SERVICE_URL:}
logging.audit.api-key=${LOGGING_API_KEY:}

# Logging
logging.level.edu.harvard.dbmi.avillach.visualization=INFO
