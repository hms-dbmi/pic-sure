version: '3.8'
services:
  pic-sure-auth-service:
    build:
        context: .
        dockerfile: ./pic-sure-auth-services/dev.Dockerfile
    environment:
      JAVA_OPTS: "-Xmx1024m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      # Note: To use this you will need to set ENVIRONMENT variables for the application.properties
    ports:
      - "8090:8090" # Application port
      - "5005:5005" # Debug port
    depends_on:
      auth-flyway:
        condition: service_completed_successfully

  picsure-db:
    build:
      context: ./pic-sure-auth-db/
      dockerfile: Dockerfile
      target: empty-db
    environment:
        MYSQL_DATABASE: auth
        MYSQL_ROOT_PASSWORD: password
    ports:
        - "3306:3306" # MySQL port
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-flyway:
    image: flyway/flyway:13-alpine@sha256:e51c63b766e54fdc5e08778018746cb0071643a8b898ca15a2cf8df268ddb584
    volumes:
      - ./pic-sure-auth-db/db/sql:/flyway/sql
    # linux/amd64
    platform: linux/amd64
    environment:
        - FLYWAY_URL=jdbc:mysql://picsure-db:3306/auth?useSSL=false&allowPublicKeyRetrieval=true
        - FLYWAY_USER=root
        - FLYWAY_PASSWORD=password
        - FLYWAY_SCHEMAS=auth
        - FLYWAY_LOCATIONS=filesystem:/flyway/sql
        - FLYWAY_IGNORE_MISSING_MIGRATIONS=true
    command:
      - migrate
    depends_on:
      picsure-db:
        condition: service_healthy
