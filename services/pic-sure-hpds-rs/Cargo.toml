[workspace]
resolver = "3"
members = ["crates/hpds-format", "crates/hpds-etl", "crates/hpds-query", "crates/hpds-rs", "crates/hpds-gen", "crates/hpds-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
rand_chacha = "0.10.0"
roaring = "0.11.5"
moka = { version = "0.12.16", features = ["sync"] }
aes-gcm = "0.11.1"
zstd = "0.14.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
thiserror = "2.0.21"
getrandom = "0.4.3"
proptest = "1.11.0"
hpds-format = { path = "crates/hpds-format" }
hpds-query = { path = "crates/hpds-query" }
tempfile = "3.27.0"
rayon = "1.12.0"
rustc-hash = "2.1.3"
libc = "0.2.190"
signal-hook = "0.4.5"
webpki-root-certs = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
hdrhistogram = "7.6.0"
libm = "0.2.16"
sha2 = "0.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
