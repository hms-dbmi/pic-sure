[package]
name = "hpds-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hpds_rs"

[[bin]]
name = "hpds-rs"
path = "src/main.rs"

[dependencies]
hpds-format.workspace = true
hpds-query = { workspace = true, features = ["tokio"] }
axum.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
http-body-util = "0.1"
tracing-appender = "0.2"
libc.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1.9"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
hpds-etl = { path = "../hpds-etl" }
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
