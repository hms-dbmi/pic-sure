name: "${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME to a unique worktree-specific project name}"
services:
  csv-loader:
    image: ${PIC_SURE_HPDS_ETL_IMAGE:?Set PIC_SURE_HPDS_ETL_IMAGE to a worktree-specific image tag}
    build:
      context: ../..
      dockerfile: docker/pic-sure-hpds-etl/Dockerfile
    environment:
      - HEAPSIZE=4096
      - LOADER_NAME=CSVLoader
    volumes:
      - ./hpds:/opt/local/phenocube
      - ./hpds:/opt/local/hpds
