name: pic-sure-hpds-etl-variantmetadata-loader
services:
  variantmetadata-loader:
    image: pic-sure-hpds-etl:local
    build:
      context: ../..
      dockerfile: docker/pic-sure-hpds-etl/Dockerfile
    environment:
      - HEAPSIZE=4096
      - LOADER_NAME=VariantMetadataLoader
    volumes:
      - ./hpds:/opt/local/phenocube
      - ./hpds:/opt/local/hpds
