name: pic-sure-hpds-etl-sql-loader
services:
  sql-loader:
    image: pic-sure-hpds-etl:local
    user: "${ETL_UID:-1000}:${ETL_GID:-1000}"
    build:
      context: ../..
      dockerfile: docker/pic-sure-hpds-etl/Dockerfile
    environment:
      - HEAPSIZE=4096
      - LOADER_NAME=SQLLoader
    volumes:
      - ./hpds:/opt/local/hpds
