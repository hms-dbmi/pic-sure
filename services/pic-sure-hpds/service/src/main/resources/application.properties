SMALL_JOB_LIMIT = 100
SMALL_TASK_THREADS = 1
LARGE_TASK_THREADS = 1

# Logging File Output https://docs.spring.io/spring-boot/reference/features/logging.html#features.logging.file-output
# If you are adding additional log files please add them to /var/log/ directory.
logging.file.name=/var/log/hpds.log
logging.level.root=info
log.pattern=%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z', UTC} %-5level --- [hpds] [%thread] %logger{36} : %msg%n
enable_file_sharing=false

# This should only be set to true if you wish to control patient data access granularly
# See edu.harvard.hms.dbmi.avillach.hpds.data.query.v3.Query.authorizationFilters for more information
# hpds.requireAuthorizationFilter=false

# Actuator: OFF BY DEFAULT. HPDS has no Spring Security in front of it, so nothing is exposed
# unless the deployment opts in. AIO's hpds.env sets PICSURE_ACTUATOR_EXPOSURE=health to enable a
# shallow readiness probe for the gateway /system/status aggregation and the deploy healthcheck;
# details stay hidden (PICSURE_ACTUATOR_DETAILS defaults to never) so no datasource/disk/component
# internals leak even when health is reachable.
management.endpoints.web.exposure.include=${PICSURE_ACTUATOR_EXPOSURE:none}
management.endpoint.health.show-details=${PICSURE_ACTUATOR_DETAILS:never}
management.endpoint.health.probes.enabled=true