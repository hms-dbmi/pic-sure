name: Operations binary compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/operations-binary-compatibility.yml'
      - 'services/pic-sure-operations-service/**'
      - 'tests/operations-binary-compatibility/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    name: Historical binaries and forward schema
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run compatibility matrix
        env:
          OPERATIONS_COMPAT_SOURCE_ROOT: ${{ github.workspace }}
        run: tests/operations-binary-compatibility/test.sh all
