name: Operations binary compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/operations-binary-compatibility.yml'
      - 'tests/operations-binary-compatibility/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    name: Historical binaries and forward schema
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run compatibility matrix
        env:
          KEEP_COMPAT_TEMP_ON_FAILURE: true
          OPERATIONS_COMPAT_SOURCE_ROOT: ${{ github.workspace }}
          TMPDIR: ${{ runner.temp }}
        run: tests/operations-binary-compatibility/test.sh all
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operations-binary-compatibility-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operations-binary-*
          if-no-files-found: warn
          retention-days: 7
