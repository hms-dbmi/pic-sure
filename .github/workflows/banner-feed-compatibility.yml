name: Banner feed compatibility

on:
  pull_request:
    paths:
      - "tests/banner-feed-compatibility/**"
      - "tests/operations-binary-compatibility/**"
      - ".github/banner-rollout-contract.json"
      - ".github/workflows/banner-feed-compatibility.yml"
      - "services/pic-sure-auth-microapp/pic-sure-auth-services/src/test/**/BannerRolloutContractTest.java"
  push:
    branches: [main]
    paths:
      - "tests/banner-feed-compatibility/**"
      - "tests/operations-binary-compatibility/**"
      - ".github/banner-rollout-contract.json"
      - ".github/workflows/banner-feed-compatibility.yml"
      - "services/pic-sure-auth-microapp/pic-sure-auth-services/src/test/**/BannerRolloutContractTest.java"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-mixed-version-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KEEP_BANNER_FEED_TEMP_ON_FAILURE: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run real backend and frontend matrix
        env:
          OPERATIONS_COMPAT_SOURCE_ROOT: ${{ github.workspace }}
          TMPDIR: ${{ runner.temp }}
        run: tests/banner-feed-compatibility/test.sh all
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: banner-feed-compatibility-diagnostics
          path: ${{ runner.temp }}/banner-feed-*/
          if-no-files-found: warn
          retention-days: 7
