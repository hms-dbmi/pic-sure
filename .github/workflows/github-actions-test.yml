name: Maven Run Tests

on:
  push:
    branches: [pic_sure_api_mono_repo, main]
  pull_request:

permissions:
  contents: read

# PR pushes supersede their in-flight run; mainline pushes queue instead, so
# every mainline commit keeps a completed verdict (bisectable CI history).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Full reactor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Plain Maven from the repository root: the reactor satisfies the
      # pic-sure-bom import, so no bootstrap, token, or warm cache is needed.
      - name: Verify with Maven
        run: mvn -T1C -B verify
      - name: Publish Surefire Report
        uses: ScalableCapital/action-surefire-report@v2
        if: always() # Ensures reports publish even if the Maven step failed
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

  lint:
    name: Spotless (dictionary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Check formatting
        run: mvn -B -pl services/picsure-dictionary,services/picsure-dictionary/aggregate,services/picsure-dictionary/dictionaryweights spotless:check
