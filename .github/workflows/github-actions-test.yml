name: Maven Run Tests

on:
  push:
  pull_request:

# Supersede in-flight runs of the full 26-module reactor for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-contract:
    name: CI bootstrap and workflow contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run CI regression tests
        run: python3 -m unittest discover --start-directory scripts/ci --pattern 'test_*.py' --verbose

  build:
    name: Full reactor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify with Maven
        run: scripts/ci/run-maven-reactor.sh verify
