name: Maven Run Tests

on:
  push:
    branches: [pic_sure_api_mono_repo, main]
  pull_request:

permissions:
  contents: read

# PR pushes supersede their in-flight run; mainline pushes queue instead, so
# every mainline commit keeps a completed verdict (bisectable CI history).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # SECURITY: this job runs PR code (the build and its tests), so its token stays read-only and
  # is not left in .git/config. With checks: write, test code could post a fake "Review policy"
  # check run as the github-actions app. Jobs that write (report, below) only read artifacts.
  # A PR that adds its own workflow is not stopped here; code-owner review of .github/ is (RISK_REVIEW.md).
  build:
    name: Full reactor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # diff-coverage reads line numbers from the pulls/files API, which are in the PR head, so measure that revision, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Plain Maven from the repository root: the reactor satisfies the
      # pic-sure-bom import, so no bootstrap, token, or warm cache is needed.
      # JaCoCo is attached from the command line for the Diff coverage job; its version comes
      # from jacoco.version in the root pom's pluginManagement, where Dependabot keeps it current.
      - name: Verify with Maven
        run: >-
          mvn -T1C -B
          org.jacoco:jacoco-maven-plugin:prepare-agent
          verify
          org.jacoco:jacoco-maven-plugin:report
          -Dmaven.test.failure.ignore=true
      # Reads the target/classes the previous step just produced. Deliberately without
      # maven.test.failure.ignore: the reactor step carries that flag, so a convention
      # violation has to fail loudly here or it would be masked. Deliberately without a
      # reactor.root override: surefire forks the test JVM with the module's own basedir as
      # its working directory, so a relative value resolves against the wrong place. The
      # pom's default is already correct.
      - name: Check API conventions
        run: mvn -B -f tools/api-conventions/pom.xml test
      # The root pom.xml pins the artifact root to the repository root (upload-artifact roots
      # it at the common ancestor of the matched files), so module paths survive the download.
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            pom.xml
            **/target/surefire-reports/TEST-*.xml
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 7
      # The report job publishes annotations, but this job is the one that fails on test
      # failures, so "Full reactor" alone still means "tests passed".
      # `|| true`: grep -l exits 1 when nothing matches (the all-green case), find -exec ... {} +
      # propagates that, and `bash -e` would fail the step silently on a passing build.
      - name: Fail on test failures
        run: |
          failed=$(find . -path '*/target/surefire-reports/TEST-*.xml' -exec grep -lE '<testsuite[^>]* (failures|errors)="[1-9]' {} + || true)
          if [ -n "$failed" ]; then
            echo "$failed"
            echo "::error::Test failures in the report(s) listed above."
            exit 1
          fi

  report:
    name: Surefire report
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The surefire report is published as a check run, which the workflow-level
    # read-only default cannot create. Nothing from the PR is executed here.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports
      - name: Publish Surefire Report
        uses: ScalableCapital/action-surefire-report@4004a71652495d6ed111f5b717c2cf9aa0f37627
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          fail_on_test_failures: true

  # Coverage of the lines a PR adds; a stand-in for a reviewer on risk:low PRs, so make it a
  # required check. Reuses the build job's JaCoCo reports instead of building again.
  diff-coverage:
    name: Diff coverage
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports
          path: reports
      - name: Coverage of changed lines
        working-directory: reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mapfile -t reports < <(find . -path '*/target/site/jacoco/jacoco.xml')
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::No JaCoCo reports were produced. Check that surefire's argLine honours the JaCoCo agent (use @{argLine} in the pom)."
            exit 1
          fi
          node ../.github/scripts/risk/diff-coverage.mjs jacoco "${reports[@]}"

  lint:
    name: Spotless (dictionary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Check formatting
        run: mvn -B -pl services/picsure-dictionary,services/picsure-dictionary/aggregate,services/picsure-dictionary/dictionaryweights spotless:check
