name: Docker Build

# The service images are built by Jenkins and the All-in-One, never here, so a Dockerfile that
# stops building goes unnoticed until a deploy. That can happen without any change in this repo:
# apk repositories drop superseded package versions, which breaks exact pins. The schedule
# catches that kind of drift; the push and pull_request triggers catch changes made here.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/*.Dockerfile'
      - '.github/workflows/docker-build.yml'
  schedule:
    - cron: '33 7 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build service images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Every image except pic-sure-auth-db copies jars out of a module's target/, and the HPDS
      # ETL module assembles its loaders into docker/pic-sure-hpds-etl/, all at package time.
      - name: Package with Maven
        run: mvn -T1C -B package -DskipTests
      # Dockerfile and build context, matching the Jenkins image jobs. The dev.Dockerfiles are
      # left out: they rebuild from source for local development and are not shipped. Every
      # image is attempted so one failure doesn't hide another.
      - name: Build images
        run: |
          failed=()
          while read -r dockerfile context; do
            echo "::group::${dockerfile}"
            if ! docker build -f "$dockerfile" "$context"; then
              failed+=("$dockerfile")
            fi
            echo "::endgroup::"
          done <<'EOF'
          services/pic-sure-gateway/Dockerfile services/pic-sure-gateway
          services/pic-sure-operations-service/Dockerfile services/pic-sure-operations-service
          services/pic-sure-hpds-query-service/Dockerfile services/pic-sure-hpds-query-service
          services/pic-sure-logging/Dockerfile services/pic-sure-logging
          services/pic-sure-visualization-service/Dockerfile services/pic-sure-visualization-service
          services/pic-sure-auth-microapp/pic-sure-auth-services/Dockerfile services/pic-sure-auth-microapp
          services/pic-sure-auth-microapp/pic-sure-auth-services/bdc.Dockerfile services/pic-sure-auth-microapp
          services/pic-sure-auth-microapp/pic-sure-auth-db/Dockerfile services/pic-sure-auth-microapp/pic-sure-auth-db
          services/pic-sure-hpds/docker/pic-sure-hpds/Dockerfile services/pic-sure-hpds
          services/pic-sure-hpds/docker/pic-sure-hpds-etl/Dockerfile services/pic-sure-hpds
          services/picsure-dictionary/Dockerfile services/picsure-dictionary
          services/picsure-dictionary/bdc.Dockerfile services/picsure-dictionary
          services/picsure-dictionary/aggregate/Dockerfile services/picsure-dictionary/aggregate
          services/picsure-dictionary/dictionaryweights/Dockerfile services/picsure-dictionary/dictionaryweights
          EOF
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::%s failed to build\n' "${failed[@]}"
            exit 1
          fi
