name: pic-sure-logging tests
on:
  pull_request:
    paths: ['services/pic-sure-logging/**']
  push:
    branches: [pic_sure_api_mono_repo, pic_sure_api_rewrite, main]
    paths: ['services/pic-sure-logging/**']
defaults:
  run:
    working-directory: services/pic-sure-logging
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run tests
        run: mvn test
