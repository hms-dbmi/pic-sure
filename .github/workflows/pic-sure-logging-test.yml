name: pic-sure-logging tests
on:
  pull_request:
    paths: ['services/pic-sure-logging/**', '.github/workflows/pic-sure-logging-test.yml']
  push:
    branches: [pic_sure_api_mono_repo, pic_sure_api_rewrite, main]
    paths: ['services/pic-sure-logging/**', '.github/workflows/pic-sure-logging-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Run tests
        run: mvn -B -pl services/pic-sure-logging -am verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
