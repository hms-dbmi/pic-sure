name: pic-sure-auth-microapp tests
on:
  pull_request:
    paths:
      - 'services/pic-sure-auth-microapp/**'
      - 'pom.xml'
      - 'platform/**'
      - 'libs/**'
      - 'scripts/ci/**'
      - '.github/workflows/pic-sure-auth-microapp-test.yml'
  push:
    branches: [pic_sure_api_mono_repo, pic_sure_api_rewrite, main]
    paths:
      - 'services/pic-sure-auth-microapp/**'
      - 'pom.xml'
      - 'platform/**'
      - 'libs/**'
      - 'scripts/ci/**'
      - '.github/workflows/pic-sure-auth-microapp-test.yml'
jobs:
  build:
    name: Verify auth services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify with Maven
        run: scripts/ci/run-maven-reactor.sh -pl services/pic-sure-auth-microapp/pic-sure-auth-services -am verify
