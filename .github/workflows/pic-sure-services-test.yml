name: pic-sure-services tests
on:
  pull_request:
    paths: ['services/pic-sure-services/**']
  push:
    branches: [pic_sure_api_mono_repo, pic_sure_api_rewrite, main]
    paths: ['services/pic-sure-services/**']
jobs:
  info-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pic-sure-services/info-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  uploader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pic-sure-services/uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
