name: pic-sure-services tests
on:
  pull_request:
    paths: ['services/pic-sure-services/**']
  push:
    branches: [pic_sure_api_mono_repo, pic_sure_api_rewrite, main]
    paths: ['services/pic-sure-services/**']
jobs:
  info-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pic-sure-services/info-service
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test
        run: mvn -B verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  uploader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pic-sure-services/uploader
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test
        run: mvn -B verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
