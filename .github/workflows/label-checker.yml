name: Label Checker
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  pull-requests: read

jobs:

  check_labels:
    name: Check labels
    runs-on: ubuntu-latest
    steps:
      - name: Require a release-notes label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ALLOWED: breaking-change|enhancement|bug|documentation|ignore-for-release|dependencies
        run: |
          matched=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq ".labels[].name | select(test(\"^($ALLOWED)$\"))")
          if [ -z "$matched" ]; then
            echo "::error::This PR needs at least one of these labels: ${ALLOWED//|/, }"
            exit 1
          fi
          echo "Matched labels: $(echo "$matched" | paste -sd, -)"
