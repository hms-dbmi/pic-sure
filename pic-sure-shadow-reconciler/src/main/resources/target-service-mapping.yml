# Independent canonical reference mapping (Task 11).
#
# This table is authored independently from the gateway's TargetServiceResolver, derived from the PSAMA
# access-rule audit (Phase-2 pre-req). It is the reconciler's own oracle for what a raw request path SHOULD
# canonicalize to, so that a bug in the gateway's resolver surfaces as a DIVERGENCE rather than the reconciler
# trivially agreeing with whatever the gateway computed.
#
# Rules are prefix rules; the reconciler matches the longest matching rawPrefix (ReferenceMapping sorts rules by
# prefix length, descending, before matching).
#
# mode:
#   COSMETIC           - the raw path is a pure rewrite of the canonical path; does not change PSAMA's consent-rule
#                         evaluation.
#   DECISION_AFFECTING - the raw path prefix itself changes which PSAMA consent rule applies (e.g. /v3 skips a
#                         consent check the /picsure variant does not), so a gateway/WildFly disagreement here is an
#                         intentional behavior difference between path variants, not a resolver bug.
rules:
  - rawPrefix: "/v3/query/"
    canonical: "/query/"
    mode: DECISION_AFFECTING   # /v3 prefix changes PSAMA's consent-rule skip
  - rawPrefix: "/picsure/query/"
    canonical: "/query/"
    mode: COSMETIC
  - rawPrefix: "/picsure/search/"
    canonical: "/search/"
    mode: COSMETIC
