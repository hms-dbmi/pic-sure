# Scope for every reactor module that declares a Spring controller.
# documented          the swagger rules apply
# internal: <reason>  the rules are skipped; the reason is required
#
# A module that declares a controller and is missing here fails R0b.
services/pic-sure-auth-microapp/pic-sure-auth-services = documented
services/picsure-dictionary = documented
services/pic-sure-hpds-query-service = documented
services/pic-sure-visualization-service = documented
services/pic-sure-operations-service = documented
services/pic-sure-hpds/service = internal: custom database engine, never exposed to clients
services/pic-sure-hpds/genomic-processor = internal: node-local RPC behind the hpds service
services/picsure-dictionary/aggregate = internal: operational dump tool, not a client API
