spring.datasource.url=jdbc:h2:mem:pic_sure_api_data_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Spring Boot's default SpringPhysicalNamingStrategy snake_cases *even explicit* @Column/@JoinColumn
# names (e.g. "queryId" -> "query_id", "resourceResultId" -> "resource_result_id"), which would
# silently break compatibility with the existing production MySQL schema: every column in the
# legacy `query`/`named_dataset`/`configuration`/`site` tables is camelCase, not snake_case (see
# pic-sure-legacy's V1/V5/V6/V8 Flyway SQL). Hibernate's own StandardImpl strategy passes names
# through unchanged. Any Spring Boot application consuming this module's entities against the real
# database MUST set this same property (or an equivalent naming strategy) in its own
# application.yml, or Hibernate will generate the wrong column names.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
